<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% block titolo %}Cinema Aurora{% endblock %}</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>

<body class="d-flex flex-column min-vh-100 bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold fs-4" href="/">
        <span class="text-warning">★</span> Cinema Aurora
      </a>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#menuPrincipale"
        aria-controls="menuPrincipale"
        aria-expanded="false"
        aria-label="Apri il menu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuPrincipale">
        <div class="navbar-nav ms-auto gap-lg-2">
          <a class="nav-link" href="{{ url_for('index') }}">Home</a>
          <a class="nav-link" href="{{ url_for('sale') }}">Sale</a>
          <a class="nav-link" href="{{ url_for('incassi') }}">Incassi</a>
        </div>
      </div>
    </div>
  </nav>

  <header class="bg-dark text-white border-top border-warning border-3">
    <div class="container py-4 py-md-5">
      <p class="text-warning fw-semibold text-uppercase small mb-2">
        Il tuo posto ti aspetta
      </p>
      <h1 class="display-6 fw-bold mb-2">Una storia da vivere sul grande schermo.</h1>
      <p class="text-white-50 mb-0">
        Scopri i film, scegli lo spettacolo e prenota il tuo biglietto.
      </p>
    </div>
  </header>

  <main class="container py-5 flex-grow-1">
    {% block contenuto %}{% endblock %}
  </main>

  <footer class="bg-dark text-white-50 mt-auto">
    <div class="container py-4 d-flex flex-column flex-md-row justify-content-between gap-2">
      <span><strong class="text-white">Cinema Aurora</strong> · Progetto scolastico</span>
      <span>Realizzato da Aurora, Claudia e Roberto</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
